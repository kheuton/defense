<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opioid Overdose Deaths — Massachusetts Grid</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #11111e; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed;
    bottom: 24px;
    right: 32px;
    font-family: Inter, system-ui, sans-serif;
    font-size: 15px;
    color: #888899;
    opacity: 0.7;
    transition: opacity 0.6s;
    pointer-events: none;
    user-select: none;
  }
  #hud.hidden { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">Click or press &rarr; to advance</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/",
    "@tweenjs/tween.js": "https://unpkg.com/@tweenjs/tween.js@23.1.1/dist/tween.esm.js"
  }
}
</script>
<script type="module" src="opioid-grid.js"></script>
</body>
</html>
