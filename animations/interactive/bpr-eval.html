<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPR Evaluation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #11111e; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed;
    bottom: 24px;
    right: 32px;
    font-family: Inter, system-ui, sans-serif;
    font-size: 15px;
    color: #888899;
    opacity: 0.7;
    transition: opacity 0.6s;
    pointer-events: none;
    user-select: none;
  }
  #hud.hidden { opacity: 0; }

  #overlays {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    user-select: none;
  }
  .chart-label {
    position: absolute;
    font-family: Inter, system-ui, sans-serif;
    font-size: 26px;
    font-weight: 600;
    color: #888899;
    text-align: center;
    opacity: 0;
    transition: opacity 0.4s;
  }
  .chart-text {
    position: absolute;
    font-family: Inter, system-ui, sans-serif;
    font-size: 22px;
    line-height: 1.8;
    color: #888899;
    text-align: center;
    opacity: 0;
    transition: opacity 0.4s;
    white-space: nowrap;
  }
  .chart-text .value { color: #ffd166; font-weight: 600; }
  .chart-text .result { font-size: 26px; font-weight: 700; }
  .chart-text .result.good { color: #50c8a8; }
  .chart-text .result.bad  { color: #ff7c57; }
  .visible { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">Click or press &rarr; to advance</div>

<div id="overlays">
  <div id="left-label"  class="chart-label"></div>
  <div id="right-label" class="chart-label"></div>
  <div id="left-rmse"   class="chart-text"></div>
  <div id="right-rmse"  class="chart-text"></div>
  <div id="left-eval"   class="chart-text"></div>
  <div id="right-eval"  class="chart-text"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/",
    "@tweenjs/tween.js": "https://unpkg.com/@tweenjs/tween.js@23.1.1/dist/tween.esm.js"
  }
}
</script>
<script type="module" src="bpr-eval.js"></script>
</body>
</html>
