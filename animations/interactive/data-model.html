<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Model — Gaussian Regression</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #11111e; font-family: Inter, system-ui, sans-serif; }

#hud {
  position: fixed; bottom: 20px; right: 24px;
  color: #888899; font-size: 13px;
  pointer-events: none; z-index: 10;
  transition: opacity 0.4s;
}
#hud.hidden { opacity: 0; }

svg {
  display: block; position: absolute; top: 0; left: 0;
  width: 100vw; height: 100vh;
}

/* ── Math font helpers (KaTeX fonts, no extra JS required for main eq) ─ */
.mi   { font-family: KaTeX_Math, serif; font-style: italic; }
.mcal { font-family: KaTeX_Caligraphic, serif; font-weight: bold; }
.mrm  { font-family: KaTeX_Main, serif; font-style: normal; }

/* ── Equation overlay ──────────────────────────────────────────────── */
#eq-overlay {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none; z-index: 5;
}

#eq-box {
  position: absolute;
  opacity: 0; transition: opacity 0.5s;
}
#eq-box.visible { opacity: 1; }

/* Line 1 */
.eq-line1 {
  color: #c8c8e0; font-size: 32px; line-height: 1.55;
  white-space: nowrap; opacity: 0; transition: opacity 0.4s;
}
.eq-line1.visible { opacity: 1; }

/* Line 2: inline so baseline aligns naturally */
.eq-terms {
  font-size: 28px; color: #c8c8e0; line-height: 1.55;
  white-space: nowrap; margin-top: 4px;
  opacity: 0; transition: opacity 0.4s;
}
.eq-terms.visible { opacity: 1; }

.theta-grp {
  display: inline-flex; flex-direction: column; align-items: flex-start;
  vertical-align: baseline;
}
.theta-main {
  display: inline;
  font-size: 28px; color: #c8c8e0;
}

/* Subscripts */
.msub {
  font-family: KaTeX_Main, serif; font-style: normal;
  font-size: 0.58em; vertical-align: -0.3em; line-height: 0;
  display: inline-block;
}
.msub-x {
  font-family: Inter, system-ui, sans-serif; font-style: normal;
  font-size: 0.45em; vertical-align: -0.35em; line-height: 0;
  display: inline-block; letter-spacing: -0.01em;
}

/* ── Slot machine ──────────────────────────────────────────────────── */
.slot-wrap {
  display: inline-block; overflow: hidden;
  height: 0.88em; vertical-align: -0.01em;
}
.slot-reel {
  display: flex; flex-direction: column;
  color: #c8c8e0;
  transition: transform 0.3s ease-out, color 0.4s;
}
.slot-reel.gold { color: #ffd166; }
/* Lock out extra reel spans after stopping to prevent sub-pixel sliver */
.slot-reel.locked {
  max-height: 0.88em;
  overflow: hidden;
}
.slot-reel > span {
  display: flex; align-items: center; justify-content: center;
  height: 0.88em; line-height: 1;
}
.slot-reel.spinning {
  animation: slotScroll 0.28s linear infinite;
}
@keyframes slotScroll {
  from { transform: translateY(0); }
  to   { transform: translateY(-2.64em); }
}

/* ── Secondary equations (RMSE, likelihood) ───────────────────────── */
.sec-eq {
  color: #c8c8e0; font-size: 22px;
  margin-top: 18px;
  opacity: 0; transition: opacity 0.5s;
}
.sec-eq.visible { opacity: 1; }
/* KaTeX inherits our color */
.sec-eq .katex { color: inherit; }

/* ── SVG elements ──────────────────────────────────────────────────── */
.tract { stroke: #222233; stroke-width: 0.3; }
.legend-label { fill: #888899; font-size: 11px; font-family: Inter, system-ui, sans-serif; }
.legend-title { fill: #888899; font-size: 11px; font-family: Inter, system-ui, sans-serif; font-weight: 600; }
</style>
</head>
<body>

<div id="hud">Click or press → to advance</div>

<div id="eq-overlay">
  <div id="eq-box">

    <!-- Line 1: y ∼ 𝒩(μ, σ²) -->
    <div class="eq-line1" id="eq1"><span class="mi">y</span>&thinsp;∼&thinsp;<span class="mcal">N</span>(<span class="mi">μ</span>,&thinsp;<span class="mi">σ</span><sup class="mrm" style="font-size:0.65em">2</sup>)</div>

    <!-- Line 2: μ = θ₀ + θ₁x_{loc} + θ₂x_{time} + θ₃x_{demo} -->
    <div class="eq-terms" id="eq2"><span class="mi">μ</span>&thinsp;=&thinsp;<!--
      --><span class="slot-wrap"><span class="slot-reel" id="reel-0"><span><span class="mi">θ</span></span></span></span><span class="msub">0</span><!--
      -->&thinsp;+&thinsp;<!--
      --><span class="slot-wrap"><span class="slot-reel" id="reel-1"><span><span class="mi">θ</span></span></span></span><span class="msub">1</span><span class="mi">x</span><span class="msub-x">loc</span><!--
      -->&thinsp;+&thinsp;<!--
      --><span class="slot-wrap"><span class="slot-reel" id="reel-2"><span><span class="mi">θ</span></span></span></span><span class="msub">2</span><span class="mi">x</span><span class="msub-x">time</span><!--
      -->&thinsp;+&thinsp;<!--
      --><span class="slot-wrap"><span class="slot-reel" id="reel-3"><span><span class="mi">θ</span></span></span></span><span class="msub">3</span><span class="mi">x</span><span class="msub-x">demo</span></div>

    <!-- Phase 7: likelihood of y -->
    <div class="sec-eq" id="likelihood-eq"></div>

    <!-- Phase 8: RMSE definition -->
    <div class="sec-eq" id="rmse-eq"></div>

  </div>
</div>

<svg id="main-svg"></svg>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
<script src="data-model.js"></script>
</body>
</html>
