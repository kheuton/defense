<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Model — Gaussian Regression</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #11111e; font-family: Inter, system-ui, sans-serif; }

#hud {
  position: fixed; bottom: 20px; right: 24px;
  color: #888899; font-size: 13px;
  pointer-events: none; z-index: 10;
  transition: opacity 0.4s;
}
#hud.hidden { opacity: 0; }

svg {
  display: block; position: absolute; top: 0; left: 0;
  width: 100vw; height: 100vh;
}

/* ── Math font helpers (KaTeX fonts, no JS required) ───────────── */
.mi   { font-family: KaTeX_Math, serif; font-style: italic; }       /* italic math */
.mcal { font-family: KaTeX_Caligraphic, serif; font-weight: bold; } /* \mathcal */
.mrm  { font-family: KaTeX_Main, serif; font-style: normal; }       /* upright */

/* ── Equation overlay ──────────────────────────────────────────── */
#eq-overlay {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none; z-index: 5;
}

#eq-box {
  position: absolute;
  opacity: 0;
  transition: opacity 0.5s;
}
#eq-box.visible { opacity: 1; }

/* Line 1 */
.eq-line1 {
  color: #c8c8e0; font-size: 32px; line-height: 1.55;
  white-space: nowrap; opacity: 0; transition: opacity 0.4s;
}
.eq-line1.visible { opacity: 1; }

/* Line 2: flex row so labels sit below each θᵢxᵢ group */
.eq-terms {
  display: flex; align-items: flex-start;
  font-size: 28px; color: #c8c8e0;
  opacity: 0; transition: opacity 0.4s;
  white-space: nowrap; margin-top: 6px;
}
.eq-terms.visible { opacity: 1; }

.plain { font-size: 28px; color: #c8c8e0; line-height: 1.4; }

/* Each θᵢxᵢ group stacks the term + label vertically */
.theta-grp {
  display: inline-flex; flex-direction: column; align-items: center;
}
.theta-main {
  display: flex; align-items: baseline;
  font-size: 28px; color: #c8c8e0; line-height: 1.4;
}
.msub {
  font-family: KaTeX_Main, serif; font-style: normal;
  font-size: 0.62em; vertical-align: -0.25em;
}
.theta-label {
  font-size: 12px; color: #888899;
  margin-top: 4px; text-align: center;
  opacity: 0; transition: opacity 0.4s;
}
.theta-label.visible { opacity: 1; }

/* ── Slot machine ──────────────────────────────────────────────── */
.slot-wrap {
  display: inline-block; overflow: hidden;
  height: 0.88em; vertical-align: 0.01em;
}
.slot-reel {
  display: flex; flex-direction: column;
  color: #c8c8e0;
  transition: transform 0.3s ease-out, color 0.4s;
}
.slot-reel.gold { color: #ffd166; }
.slot-reel > span {
  display: flex; align-items: center; justify-content: center;
  height: 0.88em; line-height: 1;
}
.slot-reel.spinning {
  animation: slotScroll 0.28s linear infinite;
}
@keyframes slotScroll {
  from { transform: translateY(0); }
  to   { transform: translateY(-2.64em); }  /* 3 × 0.88em */
}

/* ── SVG elements ──────────────────────────────────────────────── */
.tract { stroke: #222233; stroke-width: 0.3; }
.legend-label { fill: #888899; font-size: 11px; font-family: Inter, system-ui, sans-serif; }
.legend-title { fill: #888899; font-size: 11px; font-family: Inter, system-ui, sans-serif; font-weight: 600; }
</style>
</head>
<body>

<div id="hud">Click or press → to advance</div>

<div id="eq-overlay">
  <div id="eq-box">

    <!-- Line 1: y ∼ 𝒩(μ, σ²) -->
    <div class="eq-line1" id="eq1"><span class="mi">y</span>&thinsp;∼&thinsp;<span class="mcal">N</span>(<span class="mi">μ</span>,&thinsp;<span class="mi">σ</span><sup class="mrm" style="font-size:0.65em">2</sup>)</div>

    <!-- Line 2: μ = θ₀ + θ₁x₁ + θ₂x₂ + θ₃x₃ -->
    <div class="eq-terms" id="eq2">
      <span class="plain"><span class="mi">μ</span>&thinsp;=&thinsp;</span>

      <!-- θ₀ (intercept, no label) -->
      <span class="theta-grp">
        <span class="theta-main">
          <span class="slot-wrap"><span class="slot-reel" id="reel-0">
            <span><span class="mi">θ</span></span>
            <span><span class="mi">θ</span></span>
            <span><span class="mi">θ</span></span>
            <span><span class="mi">θ</span></span>
          </span></span><span class="msub">0</span>
        </span>
      </span>

      <span class="plain">&thinsp;+&thinsp;</span>

      <!-- θ₁x₁ (location) -->
      <span class="theta-grp">
        <span class="theta-main">
          <span class="slot-wrap"><span class="slot-reel" id="reel-1">
            <span><span class="mi">θ</span></span>
            <span><span class="mi">θ</span></span>
            <span><span class="mi">θ</span></span>
            <span><span class="mi">θ</span></span>
          </span></span><span class="msub">1</span><span class="mi">x</span><span class="msub">1</span>
        </span>
        <span class="theta-label" id="lbl-1">location</span>
      </span>

      <span class="plain">&thinsp;+&thinsp;</span>

      <!-- θ₂x₂ (time) -->
      <span class="theta-grp">
        <span class="theta-main">
          <span class="slot-wrap"><span class="slot-reel" id="reel-2">
            <span><span class="mi">θ</span></span>
            <span><span class="mi">θ</span></span>
            <span><span class="mi">θ</span></span>
            <span><span class="mi">θ</span></span>
          </span></span><span class="msub">2</span><span class="mi">x</span><span class="msub">2</span>
        </span>
        <span class="theta-label" id="lbl-2">time</span>
      </span>

      <span class="plain">&thinsp;+&thinsp;</span>

      <!-- θ₃x₃ (demo) -->
      <span class="theta-grp">
        <span class="theta-main">
          <span class="slot-wrap"><span class="slot-reel" id="reel-3">
            <span><span class="mi">θ</span></span>
            <span><span class="mi">θ</span></span>
            <span><span class="mi">θ</span></span>
            <span><span class="mi">θ</span></span>
          </span></span><span class="msub">3</span><span class="mi">x</span><span class="msub">3</span>
        </span>
        <span class="theta-label" id="lbl-3">demo</span>
      </span>
    </div>

  </div>
</div>

<svg id="main-svg"></svg>

<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
<script src="data-model.js"></script>
</body>
</html>
