<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Model — Gaussian Regression</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #11111e; font-family: Inter, system-ui, sans-serif; }

#hud {
  position: fixed; bottom: 20px; right: 24px;
  color: #888899; font-size: 13px;
  pointer-events: none; z-index: 10;
  transition: opacity 0.4s;
}
#hud.hidden { opacity: 0; }

svg {
  display: block; position: absolute; top: 0; left: 0;
  width: 100vw; height: 100vh;
}

/* ── Equation overlay ──────────────────────────────────────────── */
#eq-overlay {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none; z-index: 5;
}

#eq-box {
  position: absolute;
  opacity: 0;
  transition: opacity 0.5s;
}
#eq-box.visible { opacity: 1; }

.eq-line1 {
  color: #c8c8e0; font-size: 30px; line-height: 1.6;
  white-space: nowrap; opacity: 0; transition: opacity 0.4s;
}
.eq-line1.visible { opacity: 1; }

/* θ terms row */
.eq-terms {
  display: flex; align-items: flex-start;
  font-size: 28px; color: #c8c8e0;
  opacity: 0; transition: opacity 0.4s;
  white-space: nowrap; margin-top: 4px;
}
.eq-terms.visible { opacity: 1; }

.plain { font-size: 28px; color: #c8c8e0; line-height: 1.5; padding-top: 0; }

/* Each θᵢxᵢ group with label below */
.theta-grp {
  display: inline-flex; flex-direction: column; align-items: center;
}
.theta-main {
  display: flex; align-items: baseline;
  font-size: 28px; color: #c8c8e0; line-height: 1.5;
}
.sub {
  font-size: 18px; vertical-align: -0.2em; line-height: 0;
}
.theta-label {
  font-size: 12px; color: #888899;
  margin-top: 3px; text-align: center;
  opacity: 0; transition: opacity 0.4s;
}
.theta-label.visible { opacity: 1; }

/* ── Slot machine ──────────────────────────────────────────────── */
.slot-wrap {
  display: inline-block; overflow: hidden;
  height: 0.92em; vertical-align: 0em;
}
.slot-reel {
  display: flex; flex-direction: column;
  color: #c8c8e0;
  transition: transform 0.3s ease-out, color 0.4s;
}
.slot-reel.gold { color: #ffd166; }
.slot-reel > span {
  display: block; height: 0.92em; line-height: 0.92em; text-align: center;
}
.slot-reel.spinning {
  animation: slotScroll 0.28s linear infinite;
}
@keyframes slotScroll {
  from { transform: translateY(0); }
  to   { transform: translateY(-2.76em); }  /* 3 × 0.92em */
}

/* ── SVG elements ──────────────────────────────────────────────── */
.tract { stroke: #222233; stroke-width: 0.3; }
.legend-label { fill: #888899; font-size: 11px; font-family: Inter, system-ui, sans-serif; }
.legend-title { fill: #888899; font-size: 11px; font-family: Inter, system-ui, sans-serif; font-weight: 600; }
</style>
</head>
<body>

<div id="hud">Click or press → to advance</div>

<div id="eq-overlay">
  <div id="eq-box">
    <div class="eq-line1" id="eq1">y&nbsp;~&nbsp;N(μ,&nbsp;σ²)</div>
    <div class="eq-terms" id="eq2">
      <span class="plain">μ&nbsp;=&nbsp;</span>
      <span class="theta-grp">
        <span class="theta-main">
          <span class="slot-wrap"><span class="slot-reel" id="reel-0"><span>θ</span><span>θ</span><span>θ</span><span>θ</span></span></span><span class="sub">0</span>
        </span>
      </span>
      <span class="plain">&nbsp;+&nbsp;</span>
      <span class="theta-grp">
        <span class="theta-main">
          <span class="slot-wrap"><span class="slot-reel" id="reel-1"><span>θ</span><span>θ</span><span>θ</span><span>θ</span></span></span><span class="sub">1</span>x<span class="sub">1</span>
        </span>
        <span class="theta-label" id="lbl-1">location</span>
      </span>
      <span class="plain">&nbsp;+&nbsp;</span>
      <span class="theta-grp">
        <span class="theta-main">
          <span class="slot-wrap"><span class="slot-reel" id="reel-2"><span>θ</span><span>θ</span><span>θ</span><span>θ</span></span></span><span class="sub">2</span>x<span class="sub">2</span>
        </span>
        <span class="theta-label" id="lbl-2">time</span>
      </span>
      <span class="plain">&nbsp;+&nbsp;</span>
      <span class="theta-grp">
        <span class="theta-main">
          <span class="slot-wrap"><span class="slot-reel" id="reel-3"><span>θ</span><span>θ</span><span>θ</span><span>θ</span></span></span><span class="sub">3</span>x<span class="sub">3</span>
        </span>
        <span class="theta-label" id="lbl-3">demo</span>
      </span>
    </div>
  </div>
</div>

<svg id="main-svg"></svg>

<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
<script src="data-model.js"></script>
</body>
</html>
