<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surrogate vs Regret Interpolation</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #11111e; font-family: Inter, system-ui, sans-serif; }

svg {
  display: block; position: absolute; top: 0; left: 0;
  width: 100vw; height: 100vh;
}

/* ── Left panel (BPR minimization) ─────────────────────────────────── */
#left-panel {
  position: fixed; left: 0; top: 72px;
  width: 310px; bottom: 0;
  display: flex; flex-direction: column;
  justify-content: center; align-items: flex-start;
  padding: 32px 20px 32px 44px;
  pointer-events: none; z-index: 5;
  opacity: 0; transition: opacity 0.6s;
}
#left-panel.visible { opacity: 1; }

/* ── Right panel (SPO+ minimization) ───────────────────────────────── */
#right-panel {
  position: fixed; right: 0; top: 72px;
  width: 310px; bottom: 0;
  display: flex; flex-direction: column;
  justify-content: center; align-items: flex-start;
  padding: 32px 44px 32px 20px;
  pointer-events: none; z-index: 5;
  opacity: 0; transition: opacity 0.6s;
}
#right-panel.visible { opacity: 1; }

.panel-label {
  font-size: 15px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 14px;
}
#left-label  { color: #50c8a8; }
#right-label { color: #7c6af7; }

.eq-block { color: #c8c8e0; }
.eq-block .katex { color: #c8c8e0; font-size: 1.15em; }
.eq-block .katex-display { margin: 0; }

/* ── HUD ─────────────────────────────────────────────────────────────── */
#hud {
  position: fixed; bottom: 20px; right: 24px;
  color: #888899; font-size: 13px;
  pointer-events: none; z-index: 10;
  transition: opacity 0.4s;
}
#hud.hidden { opacity: 0; }
</style>
</head>
<body>

<svg id="main-svg"></svg>

<!-- Left panel: BPR minimization -->
<div id="left-panel">
  <div id="left-label" class="panel-label">BPR minimum</div>
  <div class="eq-block" id="eq-bpr"></div>
</div>

<!-- Right panel: SPO+ minimization -->
<div id="right-panel">
  <div id="right-label" class="panel-label">SPO+ minimum</div>
  <div class="eq-block" id="eq-spo"></div>
</div>

<div id="hud">Click or press &rarr; to advance</div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
<script src="surrogate-interp.js"></script>
</body>
</html>
