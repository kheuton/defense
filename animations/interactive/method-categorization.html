<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Method Categorization</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #11111e; font-family: Inter, system-ui, sans-serif; }
svg { display: block; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
#hud {
  position: fixed; bottom: 20px; right: 24px;
  color: #888899; font-size: 13px;
  pointer-events: none; z-index: 10;
  transition: opacity 0.4s;
}
#hud.hidden { opacity: 0; }
</style>
</head>
<body>
<svg id="main-svg"></svg>
<div id="hud">Click or press &rarr; to advance</div>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
<script src="method-categorization.js"></script>
</body>
</html>
