<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surrogate Loss Landscapes</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #11111e; }
  canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: fixed;
    bottom: 24px; right: 32px;
    font-family: Inter, system-ui, sans-serif;
    font-size: 15px;
    color: #888899;
    opacity: 0.7;
    transition: opacity 0.6s;
    pointer-events: none;
    user-select: none;
  }
  #hud.hidden { opacity: 0; }

  #overlays {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; user-select: none;
  }

  .axis-label {
    position: absolute;
    font-family: Inter, system-ui, sans-serif;
    font-size: 22px;
    font-weight: 600;
    color: #888899;
    text-align: center;
    opacity: 0;
    transition: opacity 0.5s;
  }
  .tick-label {
    position: absolute;
    font-family: Inter, system-ui, sans-serif;
    font-size: 17px;
    color: #888899;
    text-align: center;
    opacity: 0;
    transition: opacity 0.5s;
    white-space: nowrap;
  }
  .visible { opacity: 1 !important; }

  /* ── Equation box — upper-left ─────────────────────────── */
  #eq-box {
    position: fixed;
    top: 28px;
    left: 28px;
    background: rgba(17, 17, 30, 0.88);
    border: 1.5px solid #2a2a40;
    border-radius: 10px;
    padding: 13px 26px 15px;
    text-align: left;
    opacity: 0;
    transition: opacity 0.45s;
    max-width: 680px;
  }
  #eq-box.visible { opacity: 1; }
  #eq-name {
    font-family: Inter, system-ui, sans-serif;
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }
  #eq-math {
    font-size: 15px;
    color: #ccccdd;
    line-height: 1;
  }

  /* ── Legend — lower-left ───────────────────────────────── */
  #legend {
    position: fixed;
    bottom: 28px;
    left: 28px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .legend-row {
    display: flex;
    align-items: center;
    gap: 11px;
    font-family: Inter, system-ui, sans-serif;
    font-size: 17px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.5s;
    white-space: nowrap;
  }
  .legend-swatch {
    display: inline-block;
    width: 30px;
    height: 4px;
    border-radius: 2px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">Click or press &rarr; to advance</div>

<div id="overlays">
  <div id="y-axis-label" class="axis-label"></div>
  <div id="x-axis-label" class="axis-label"></div>
  <!-- x-axis tick labels -->
  <div id="tick-neg1" class="tick-label">&minus;1</div>
  <div id="tick-0"    class="tick-label">0</div>
  <div id="tick-pos1" class="tick-label">+1</div>
  <!-- y-axis tick labels -->
  <div id="tick-y0" class="tick-label">0</div>
  <div id="tick-y1" class="tick-label">0.2</div>
  <div id="tick-y2" class="tick-label">0.4</div>
  <div id="tick-y3" class="tick-label">0.6</div>

  <!-- Equation box (upper-left) -->
  <div id="eq-box">
    <div id="eq-name"></div>
    <div id="eq-math"></div>
  </div>

  <!-- Legend (lower-left) — rows added dynamically by JS -->
  <div id="legend"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
    "@tweenjs/tween.js": "https://unpkg.com/@tweenjs/tween.js@23.1.1/dist/tween.esm.js"
  }
}
</script>
<script type="module" src="loss-landscape.js"></script>
</body>
</html>
