<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Frontier</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #11111e; font-family: Inter, system-ui, sans-serif; }

svg {
  display: block; position: absolute; top: 0; left: 0;
  width: 100vw; height: 100vh;
}

/* ── Left equation panel ───────────────────────────────────────────── */
#eq-panel {
  position: fixed; left: 0; top: 0;
  width: 44%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: center;
  padding: 48px 40px 48px 60px;
  pointer-events: none; z-index: 5;
}

#eq-title {
  color: #ddddee;
  font-size: 30px;
  font-weight: 700;
  line-height: 1.4;
  margin-bottom: 52px;
}

#eq-area {
  position: relative;
  height: 260px;
}

.eq-block {
  position: absolute; top: 0; left: 0;
  opacity: 0; transition: opacity 0.5s;
  color: #c8c8e0;
}
.eq-block.visible { opacity: 1; }

/* Each .eq-block contains one or two KaTeX divs */
.eq-main {
  font-size: 40px;
  line-height: 1.6;
}
.eq-main .katex { font-size: 1em; color: #c8c8e0; }

.eq-constr {
  margin-top: 18px;
  font-size: 30px;
  line-height: 1.6;
}
.eq-constr .katex { font-size: 1em; color: #c8c8e0; }

/* ── HUD ───────────────────────────────────────────────────────────── */
#hud {
  position: fixed; bottom: 20px; right: 24px;
  color: #888899; font-size: 13px;
  pointer-events: none; z-index: 10;
  transition: opacity 0.4s;
}
#hud.hidden { opacity: 0; }
</style>
</head>
<body>

<svg id="main-svg"></svg>

<div id="eq-panel">
  <div id="eq-title">Contribution 3: How to train to<br>balance BPR and Likelihood</div>
  <div id="eq-area">

    <!-- Phase 1: maximize log-likelihood -->
    <div id="eq1" class="eq-block">
      <div class="eq-main" id="eq1-main"></div>
    </div>

    <!-- Phase 2: maximize BPR only -->
    <div id="eq2" class="eq-block">
      <div class="eq-main" id="eq2-main"></div>
    </div>

    <!-- Phase 3+: maximize log-likelihood subject to BPR constraint -->
    <div id="eq3" class="eq-block">
      <div class="eq-main" id="eq3-main"></div>
      <div class="eq-constr" id="eq3-constr"></div>
    </div>

  </div>
</div>

<div id="hud">Click or press &rarr; to advance</div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
<script src="frontier.js"></script>
</body>
</html>
