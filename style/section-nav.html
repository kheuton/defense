<style>
  .section-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    align-items: baseline;
    gap: 0.3em;
    padding-bottom: 12px;
    z-index: 50;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.4s;
  }
  .section-nav.hidden {
    opacity: 0;
  }
  .section-nav .sec {
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0;
    text-transform: uppercase;
    color: #888899;
    transition: color 0.35s ease, font-size 0.35s ease;
  }
  .section-nav .sec.active {
    font-size: 22px;
    color: var(--nav-color);
  }

  .slide-counter {
    position: fixed;
    bottom: 14px;
    right: 20px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: #888899;
    z-index: 50;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.4s;
  }
  .slide-counter.hidden {
    opacity: 0;
  }
</style>

<div class="section-nav hidden" id="section-nav">
  <span class="sec" data-id="introduction" style="--nav-color:#ffd166">Introduction</span>
  <span class="sec" data-id="evaluation"   style="--nav-color:#50c8a8">Evaluation</span>
  <span class="sec" data-id="training"     style="--nav-color:#7c6af7">Training</span>
  <span class="sec" data-id="benchmarking" style="--nav-color:#ff7c57">Benchmarking</span>
  <span class="sec" data-id="conclusion"   style="--nav-color:#ffd166">Conclusion</span>
</div>

<div class="slide-counter hidden" id="slide-counter"></div>

<script>
(function () {
  // indexh=0 is the title slide; each # section maps to indexh 1..N in order.
  const ORDER   = ['introduction', 'evaluation', 'training', 'benchmarking', 'conclusion'];
  const nav     = document.getElementById('section-nav');
  const counter = document.getElementById('slide-counter');
  const labels  = Array.from(nav.querySelectorAll('.sec'));

  function visibleChildren(section) {
    return Array.from(section.querySelectorAll(':scope > section'))
      .filter(s => s.getAttribute('data-visibility') !== 'hidden');
  }

  function update(indexh, indexv) {
    if (indexh === 0) {
      nav.classList.add('hidden');
      counter.classList.add('hidden');
      return;
    }

    // Section nav
    nav.classList.remove('hidden');
    const active = ORDER[indexh - 1] ?? null;
    labels.forEach(el => el.classList.toggle('active', el.dataset.id === active));

    // Slide counter
    const hSlides = Reveal.getHorizontalSlides();
    const hSection = hSlides[indexh];
    if (!hSection) { counter.classList.add('hidden'); return; }

    const vSlides = visibleChildren(hSection);
    const total   = vSlides.length || 1;
    counter.classList.remove('hidden');
    counter.textContent = `${indexv + 1} / ${total}`;
  }

  function attach() {
    Reveal.on('slidechanged', e => update(e.indexh, e.indexv));
    const s = Reveal.getState();
    update(s.indexh, s.indexv);
  }

  if (typeof Reveal !== 'undefined') {
    Reveal.isReady() ? attach() : Reveal.on('ready', attach);
  }
})();
</script>
